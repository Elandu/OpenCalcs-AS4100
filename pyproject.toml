[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
[project]
name = "opencalcs-as4100"
version = "0.3.0"
description = "Clause-traced AS 4100 steel design calculations for OpenCalcs."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["jsonschema>=4.22,<5"]
[project.urls]
Repository = "https://github.com/Elandu/OpenCalcs-AS4100"
Issues = "https://github.com/Elandu/OpenCalcs-AS4100/issues"
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "build>=1.2,<2"]
[project.entry-points."opencalcs.plugins"]
as4100 = "opencalcs_as4100.plugin:get_plugin"
[tool.hatch.build.targets.wheel]
packages = ["src/opencalcs_as4100"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
