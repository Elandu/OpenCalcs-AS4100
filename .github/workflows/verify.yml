name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install "engcalcs @ git+https://github.com/Elandu/OpenCalcs.git@aecdcedfd1b4682513fa3223870576848695417a" "$(find dist -name '*.whl' | head -n 1)[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q -o pythonpath= --import-mode=importlib
      - run: python -m engcalcs_as4100.verification --output validation/benchmarks.json
      - uses: actions/upload-artifact@v4
        with:
          name: calculation-verification
          path: validation/benchmarks.json
